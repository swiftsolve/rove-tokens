name: Build

# Build the tokens on every release tag, before Rove points at it: the build
# stops if a Figma variable's code syntax doesn't match its name or a reference
# doesn't resolve, which would otherwise first show up when Rove installs the
# package. Then check the token reference in DESIGN.md was rebuilt and
# committed, and lint the code. Run it by hand to check main between releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci runs the build through `prepare`.
      - run: npm ci

      - run: npm run lint

      - name: Check DESIGN.md is up to date
        run: |
          node scripts/checks/design-md.mjs || { echo "::error::DESIGN.md is out of date: run npm run build and commit it"; exit 1; }
