name: Build

# Build the tokens on every release tag, before Rove points at it: the build
# stops if a Figma variable's code syntax doesn't match its name or a reference
# doesn't resolve, which would otherwise first show up when Rove installs the
# package. Then lint, and run every check in scripts/checks (DESIGN.md rebuilt
# and committed, descriptions, WCAG AA contrast, the plugin), as npm run check
# does. Run it by hand to check main between releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci runs the build through `prepare`.
      - run: npm ci

      - run: npm run lint

      - name: Checks
        run: node scripts/checks/run.mjs
