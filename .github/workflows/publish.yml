name: Release

# On each release tag, check the tokens, then publish them to npm
# (https://www.npmjs.com/package/@swiftsolve/rove-tokens) only if the check
# passes, so a build error or a contrast failure never reaches Rove. Run it on
# demand from Actions to check main between releases: it publishes only from a
# tag.
#
# It signs in with npm trusted publishing, so the repo holds no npm token: on
# npmjs.com the package's Settings name this repository and publish.yml as a
# trusted publisher, so keep this file's name. npm attaches a provenance
# statement to each version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build, lint, the contrast and DESIGN.md format checks, and the
      # plugin test.
      - run: npm run check

      # The build rewrites TOKENS.md and DESIGN.md's front matter, so the
      # committed ones must match it.
      - name: TOKENS.md and DESIGN.md are up to date
        run: git diff --exit-code -- TOKENS.md DESIGN.md

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # npm ci builds the tokens through `prepare`, and npm publish builds them
      # again before packing, so the package ships dist/.
      - run: npm ci

      - run: npm publish
