<style>
  /* Figma's theme colours (showUI themeColors), with UI3 light values for a plain browser. */
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #000000e5);
    --text-secondary: var(--figma-color-text-secondary, #00000080);
    --text-tertiary: var(--figma-color-text-tertiary, #0000004d);
    --text-danger: var(--figma-color-text-danger, #dc3412);
    --border: var(--figma-color-border, #e6e6e6);
    /* Rove's accent/solid, accent/solid-hover and text/on-solid. */
    --accent-solid: #3a69d5;
    --accent-solid-hover: #2f5bc0;
    --text-on-solid: #fff;
    --syntax-key: #7c3aed;
    --syntax-string: #0f7b4f;
    --syntax-number: #c2410c;
    --syntax-literal: #0369a1;
  }
  .figma-dark {
    --accent-solid: #476ec8;
    --accent-solid-hover: #3d62b8;
    --syntax-key: #c4a5ff;
    --syntax-string: #7dd3a8;
    --syntax-number: #fdba74;
    --syntax-literal: #7cc4f8;
  }

  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font:
      11px/16px Inter,
      system-ui,
      -apple-system,
      'Segoe UI',
      sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    cursor: default;
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 14px 12px 12px;
  }
  header svg {
    flex: none;
    margin-top: 2px;
  }
  h1 {
    margin: 0;
    font-size: 13px;
    line-height: 20px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .meta {
    margin-top: 2px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .meta b {
    color: var(--text);
    font-weight: 500;
  }

  nav {
    display: flex;
    gap: 2px;
    margin: 0 12px;
    padding: 2px;
    border-radius: 6px;
    background: var(--bg-secondary);
  }
  nav button {
    flex: 1;
    height: 24px;
    border: 0;
    border-radius: 5px;
    background: none;
    color: var(--text-secondary);
    font-weight: 500;
  }
  nav button:hover {
    color: var(--text);
  }
  nav button[aria-selected='true'] {
    background: var(--bg);
    color: var(--text);
    box-shadow:
      0 0 0 0.5px var(--border),
      0 1px 2px #0000001a;
  }
  nav .count {
    margin-left: 4px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  main {
    flex: 1;
    min-height: 0;
    margin: 10px 12px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  pre {
    margin: 0;
    height: 100%;
    overflow: auto;
    padding: 8px 0;
    font:
      11px/17px 'SF Mono',
      ui-monospace,
      Menlo,
      Consolas,
      monospace;
    tab-size: 2;
    counter-reset: line;
  }
  pre span.line {
    display: block;
    padding-right: 12px;
  }
  pre span.line::before {
    counter-increment: line;
    content: counter(line);
    display: inline-block;
    width: 36px;
    margin-right: 12px;
    padding-right: 8px;
    text-align: right;
    color: var(--text-tertiary);
    user-select: none;
  }
  .json-key {
    color: var(--syntax-key);
  }
  .json-string {
    color: var(--syntax-string);
  }
  .json-number {
    color: var(--syntax-number);
  }
  .json-literal {
    color: var(--syntax-literal);
  }

  .state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: var(--text-secondary);
  }
  .state.error {
    color: var(--text-danger);
  }
  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent-solid);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(1turn);
    }
  }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
  }
  .hint {
    flex: 1;
    min-width: 0;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hint code {
    font:
      11px 'SF Mono',
      ui-monospace,
      Menlo,
      Consolas,
      monospace;
    color: var(--text);
  }
  .btn {
    height: 24px;
    padding: 0 10px;
    border-radius: 5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:disabled {
    opacity: 0.4;
  }
  .primary {
    border: 0;
    background: var(--accent-solid);
    color: var(--text-on-solid);
  }
  .primary:hover:not(:disabled) {
    background: var(--accent-solid-hover);
  }
  .secondary {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .secondary:hover:not(:disabled) {
    background: var(--bg-secondary);
  }

  /* Check: the list of differences. */
  .diff {
    height: 100%;
    overflow: auto;
    margin: 0;
    padding: 4px 0;
    list-style: none;
  }
  .diff li {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
  }
  .diff li:last-child {
    border-bottom: 0;
  }
  .diff .what {
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .diff .kind {
    color: var(--text-tertiary);
  }
  .diff .name {
    font-weight: 500;
  }
  .diff .field {
    color: var(--text-secondary);
  }
  .diff .values {
    display: grid;
    grid-template-columns: 44px 1fr;
    margin-top: 2px;
    color: var(--text-secondary);
    font:
      11px/16px 'SF Mono',
      ui-monospace,
      Menlo,
      Consolas,
      monospace;
    word-break: break-word;
  }
  .diff .values span:nth-child(odd) {
    color: var(--text-tertiary);
  }
</style>

<header>
  <!-- The Rove Mark (docs/assets/rove-mark.svg), with the viewBox cropped to its ink. -->
  <svg width="18.1" height="16" viewBox="4.5 4.5 39 34.5" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="rove-mark" x1="24" y1="7" x2="24" y2="41" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#7aa4ff" />
        <stop offset="1" stop-color="#5484f5" />
      </linearGradient>
    </defs>
    <circle cx="24" cy="24" r="7.5" fill="url(#rove-mark)" />
    <path
      d="M 11.98 36.02 A 17 17 0 1 1 36.02 36.02"
      stroke="url(#rove-mark)"
      stroke-width="5"
      stroke-linecap="round"
    />
  </svg>
  <div>
    <h1 id="title">Rove Tokens</h1>
    <div class="meta" id="meta">Reading the file…</div>
  </div>
</header>
<nav role="tablist">
  <button role="tab" data-file="variables.json" aria-selected="true">
    Variables<span class="count" id="count-variables.json"></span>
  </button>
  <button role="tab" data-file="text-styles.json" aria-selected="false">
    Text styles<span class="count" id="count-text-styles.json"></span>
  </button>
  <button role="tab" data-file="effect-styles.json" aria-selected="false">
    Shadows<span class="count" id="count-effect-styles.json"></span>
  </button>
  <button role="tab" data-file="check" aria-selected="false">Check<span class="count" id="count-check"></span></button>
</nav>
<main id="view">
  <div class="state">
    <div class="spinner"></div>
    Reading variables, text styles and shadows…
  </div>
</main>
<footer id="export-footer">
  <span class="hint">Save to <code>src/figma/</code></span>
  <button class="btn primary" id="export" disabled>Export</button>
</footer>
<footer id="check-footer" hidden>
  <span class="hint" id="source"></span>
  <button class="btn primary" id="choose">Choose files</button>
  <input type="file" id="files" accept=".json" multiple hidden />
</footer>

<script>
  const $ = (id) => document.getElementById(id)
  // The exported files' text by name, and the open tab: a file's name, or 'check'.
  let files = null
  let currentTab = 'variables.json'

  const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
  // A JSON string (and the colon that makes it a key), true/false/null, or a number.
  const JSON_TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g
  /** A line of JSON as HTML, each token in a span coloured by its kind. */
  const highlight = (line) =>
    escapeHtml(line).replace(JSON_TOKEN, (match, string, colon, literal) => {
      if (string && colon) return `<span class="json-key">${string}</span>${colon}`
      if (string) return `<span class="json-string">${string}</span>`
      if (literal) return `<span class="json-literal">${match}</span>`
      return `<span class="json-number">${match}</span>`
    })

  // Check: the repo's tokens to compare with, where they came from, and the last result.
  let repo = null
  let repoSource = ''
  let result = null
  let isChecking = false
  let checkError = ''

  const stateHtml = (html, hasSpinner) =>
    `<div class="state">${hasSpinner ? '<div class="spinner"></div>' : ''}<div>${html}</div></div>`

  // The file is where tokens are designed, so a difference is fixed by exporting
  // it into the repo, or, when the repo was edited by hand, by changing Figma.
  /** The Check tab's view as HTML. */
  function checkHtml() {
    if (checkError) return `<div class="state error">${escapeHtml(checkError)}</div>`
    if (isChecking) return stateHtml('Comparing with the repo…', true)
    if (!result) return stateHtml('Choose the three files in src/figma/ from a checkout to compare this file with.')
    if (!result.diff.length) return stateHtml(`In step with ${escapeHtml(repoSource)}.`)
    const items = result.diff.map((difference) => {
      const values =
        difference.change === 'differs'
          ? `<div class="values"><span>Figma</span><span>${escapeHtml(String(difference.figma))}</span><span>Repo</span><span>${escapeHtml(String(difference.repo))}</span></div>`
          : `<div class="values"><span></span><span>${difference.change === 'missing' ? 'Only in the repo' : 'Only in Figma'}</span></div>`
      return `<li><div class="what"><span class="kind">${difference.kind}</span><span class="name">${escapeHtml(difference.name)}</span><span class="field">${escapeHtml(difference.field || '')}</span></div>${values}</li>`
    })
    return `<ul class="diff">${items.join('')}</ul>`
  }

  /** Draw the current tab, its footer and the tab bar's selection. */
  function showCurrentTab() {
    for (const tab of document.querySelectorAll('[role=tab]'))
      tab.setAttribute('aria-selected', tab.dataset.file === currentTab)
    const isCheckTab = currentTab === 'check'
    $('export-footer').hidden = isCheckTab
    $('check-footer').hidden = !isCheckTab
    if (isCheckTab) {
      $('view').innerHTML = checkHtml()
      $('count-check').textContent = result ? result.diff.length : ''
      return
    }
    if (!files) return
    $('view').innerHTML = `<pre>${files[currentTab]
      .split('\n')
      .map((line) => `<span class="line">${highlight(line)}</span>`)
      .join('')}</pre>`
  }

  /** Ask code.js to check the file against `repo`. */
  function requestCheck() {
    isChecking = true
    checkError = ''
    parent.postMessage({ pluginMessage: { type: 'check', repo } }, '*')
    showCurrentTab()
  }

  /** Take the repo's tokens, say where they came from, and check. */
  function checkAgainst(tokens, from) {
    repo = tokens
    repoSource = from
    $('source').textContent = from
    requestCheck()
  }

  // Files from a checkout: the three in src/figma/.
  $('choose').onclick = () => $('files').click()
  $('files').onchange = async () => {
    const chosen = {}
    for (const f of $('files').files) chosen[f.name] = JSON.parse(await f.text())
    $('files').value = ''
    const missing = ['variables.json', 'text-styles.json', 'effect-styles.json'].filter((n) => !chosen[n])
    if (missing.length) {
      checkError = `Choose all three files in src/figma/; missing ${missing.join(', ')}.`
      showCurrentTab()
      return
    }
    checkAgainst(
      {
        variables: chosen['variables.json'],
        textStyles: chosen['text-styles.json'],
        effectStyles: chosen['effect-styles.json'],
      },
      'the chosen files',
    )
  }

  onmessage = (event) => {
    // Only the plugin's own message (code.js) concerns this page.
    const message = event.data?.pluginMessage
    if (!message) return
    if (message.type === 'error') {
      // An error while checking, or on the Check tab, is the check's; otherwise the export's.
      if (isChecking || currentTab === 'check') {
        isChecking = false
        checkError = message.error
        showCurrentTab()
        return
      }
      $('meta').textContent = 'Export failed'
      $('view').innerHTML = `<div class="state error">${escapeHtml(message.error)}</div>`
      return
    }
    if (message.type === 'check') {
      isChecking = false
      result = message
      showCurrentTab()
      return
    }
    // Otherwise it's the export, sent once when the plugin opens.
    files = message.files
    const variables = JSON.parse(files['variables.json'])
    const styles = JSON.parse(files['text-styles.json'])
    const shadows = JSON.parse(files['effect-styles.json'])
    if (variables.file?.name) $('title').textContent = variables.file.name
    $('meta').innerHTML =
      `<b>${variables.collections.length}</b> collections, <b>${variables.variables.length}</b> variables, <b>${styles.styles.length}</b> text styles, <b>${shadows.styles.length}</b> shadows`
    $('count-variables.json').textContent = variables.variables.length
    $('count-text-styles.json').textContent = styles.styles.length
    $('count-effect-styles.json').textContent = shadows.styles.length
    $('export').disabled = false
    showCurrentTab()
  }

  for (const tab of document.querySelectorAll('[role=tab]'))
    tab.onclick = () => {
      currentTab = tab.dataset.file
      showCurrentTab()
    }

  const downloadFile = (name) => {
    const link = document.createElement('a')
    link.href = URL.createObjectURL(new Blob([files[name] + '\n'], { type: 'application/json' }))
    link.download = name
    link.click()
  }

  // A short gap between them, or the browser may drop the later downloads.
  $('export').onclick = () => {
    ;['variables.json', 'text-styles.json', 'effect-styles.json'].forEach((name, i) =>
      setTimeout(() => downloadFile(name), i * 300),
    )
  }
</script>
